<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Szenenboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&family=IBM+Plex+Sans:wght@400;500;600&family=Literata:opsz,wght@7..72,400;7..72,600&display=swap">
<style>
/* Layout: three views behind one top menu (Story · Szenenboard · Figuren). Board = infinite dotted canvas with floating tool islands; Story = centred manuscript column; Figuren = card grid with side editor. Project/version manager drops down from the top-left island. */
:root{
  --bg:#f2f3f5; --dot:#c9ced6; --ink:#1e232b; --muted:#5f6875; --rule:#e1e4e9;
  --panel:#ffffff; --hover:#eef1f5; --accent:#3859d6; --accent-ink:#ffffff; --field:#f6f7f9;
  --therefore:#3859d6; --because:#c26a00; --but:#c2334d;
  --n-yellow:#fff3a3; --n-pink:#ffd1dc; --n-blue:#cfe6ff; --n-green:#d4f2c9; --n-orange:#ffdcb3; --n-purple:#e5d9ff;
  --note-ink:#22262d; --note-muted:#4b5260; --note-line:rgba(0,0,0,.12);
  --shadow:0 1px 2px rgba(20,25,35,.08),0 4px 16px rgba(20,25,35,.10);
  --shadow-note:0 1px 1px rgba(0,0,0,.06),0 6px 14px rgba(0,0,0,.10);
  --f-slug:"Courier Prime","Courier New",Courier,monospace;
  --f-ui:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-read:"Literata",Georgia,"Times New Roman",serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#16191e; --dot:#30363f; --ink:#e6e9ee; --muted:#9aa3b0; --rule:#2c323b;
  --panel:#1f242b; --hover:#2a3038; --accent:#8ea4ff; --accent-ink:#10131a; --field:#191d23;
  --therefore:#8ea4ff; --because:#f0a64a; --but:#f2788d;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.45);
  --shadow-note:0 1px 1px rgba(0,0,0,.3),0 8px 18px rgba(0,0,0,.4);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#16191e; --dot:#30363f; --ink:#e6e9ee; --muted:#9aa3b0; --rule:#2c323b;
  --panel:#1f242b; --hover:#2a3038; --accent:#8ea4ff; --accent-ink:#10131a; --field:#191d23;
  --therefore:#8ea4ff; --because:#f0a64a; --but:#f2788d;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.45);
  --shadow-note:0 1px 1px rgba(0,0,0,.3),0 8px 18px rgba(0,0,0,.4);
  color-scheme:dark}

[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);overflow:hidden}
button,select{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- board canvas ---------- */
#viewport{position:fixed;inset:0;overflow:hidden;touch-action:none;
  background-color:var(--bg);background-image:radial-gradient(circle,var(--dot) 1.2px,transparent 1.4px);background-size:24px 24px}
#viewport.panning{cursor:grabbing}
#world{position:absolute;left:0;top:0;transform-origin:0 0}
#links{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
#cards,#labels{position:absolute;left:0;top:0}

.card{position:absolute;left:0;top:0;width:240px;min-height:170px;padding:12px 14px 14px;box-sizing:border-box;
  background:var(--n-yellow);color:var(--note-ink);box-shadow:var(--shadow-note);border-radius:2px;
  display:flex;flex-direction:column;gap:6px;cursor:grab;user-select:none}
.card[data-c="pink"]{background:var(--n-pink)} .card[data-c="blue"]{background:var(--n-blue)}
.card[data-c="green"]{background:var(--n-green)} .card[data-c="orange"]{background:var(--n-orange)} .card[data-c="purple"]{background:var(--n-purple)}
.card.sel{outline:2px solid var(--accent);outline-offset:3px}
.card.drop{outline:2px dashed var(--accent);outline-offset:3px}
.card.dragging{cursor:grabbing;box-shadow:0 12px 28px rgba(0,0,0,.22)}
.c-top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.c-num{font-family:var(--f-slug);font-weight:700;font-size:22px;line-height:1}
.c-tags{display:flex;gap:4px}
.c-tag{font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--note-muted);border:1px solid var(--note-line);padding:1px 6px;border-radius:8px}
.c-slug{font-family:var(--f-slug);font-weight:700;font-size:13.5px;text-transform:uppercase;letter-spacing:.02em;line-height:1.3;
  padding-bottom:6px;border-bottom:1px solid var(--note-line);overflow-wrap:anywhere}
.c-body{font-size:13px;line-height:1.45;white-space:pre-wrap;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:7;-webkit-box-orient:vertical;overflow:hidden}
.ph{color:var(--note-muted);font-style:italic;text-transform:none;font-weight:400}
.handle{position:absolute;right:-11px;top:50%;width:22px;height:22px;margin-top:-11px;border-radius:50%;
  border:2px solid var(--panel);background:var(--accent);color:var(--accent-ink);font-size:14px;line-height:16px;padding:0;
  opacity:0;transition:opacity .12s,transform .12s;cursor:crosshair;box-shadow:var(--shadow)}
.card:hover .handle,.card.sel .handle{opacity:1}
.handle:hover{transform:scale(1.15)}
@media (hover:none){.handle{opacity:.9}}

.lk{fill:none;stroke-width:2.2}
.lk.t-therefore{stroke:var(--therefore)} .lk.t-because{stroke:var(--because);stroke-dasharray:8 5} .lk.t-but{stroke:var(--but);stroke-dasharray:2 5;stroke-linecap:round}
.lk.on{stroke-width:3.6}
.lk.temp{stroke:var(--accent);stroke-dasharray:4 4;opacity:.8}
.mk-therefore{fill:var(--therefore)} .mk-because{fill:var(--because)} .mk-but{fill:var(--but)} .mk-temp{fill:var(--accent)}
.lbl{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;font-size:11px;font-weight:600;letter-spacing:.08em;
  text-transform:uppercase;padding:3px 9px;border-radius:12px;background:var(--panel);border:1.5px solid currentColor;box-shadow:var(--shadow)}
.lbl.t-therefore{color:var(--therefore)} .lbl.t-because{color:var(--because)} .lbl.t-but{color:var(--but)}
.lbl.on{background:currentColor}.lbl.on span{color:var(--panel)}

/* ---------- islands ---------- */
.island{position:fixed;background:var(--panel);box-shadow:var(--shadow);border-radius:10px;display:flex;align-items:center;gap:2px;padding:4px;z-index:5}
.ib{border:0;background:transparent;border-radius:7px;padding:7px 10px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.ib:hover{background:var(--hover)}
.ib.on{background:var(--hover);color:var(--accent)}
.ib svg{width:18px;height:18px;flex:none}
.sep{width:1px;align-self:stretch;background:var(--rule);margin:4px 3px}
.top{top:calc(12px + env(safe-area-inset-top,0px))}

#isProj{left:max(16px,env(safe-area-inset-left,0px));padding:4px 4px 4px 8px;max-width:calc(50% - 140px);min-width:0}
.logo{width:24px;height:24px;border-radius:6px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--f-slug);font-weight:700;font-size:13px;flex:none}
#projBtn{font-weight:600;font-size:14px;min-width:0;max-width:240px}
#projBtn .pn{overflow:hidden;text-overflow:ellipsis}
.vchip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;padding:3px 8px;border-radius:12px;background:var(--hover)}
.vdot{width:10px;height:10px;border-radius:50%;border:1px solid rgba(0,0,0,.18);flex:none;display:inline-block}
.caret{font-size:10px;color:var(--muted)}

#isTabs{left:50%;transform:translateX(-50%)}
#isTabs .ib{padding:7px 14px}
#isTabs .ib.on{background:var(--accent);color:var(--accent-ink)}
#isActions{right:max(16px,env(safe-area-inset-right,0px))}

#isTools{left:max(16px,env(safe-area-inset-left,0px));top:50%;transform:translateY(-50%);flex-direction:column;padding:6px;gap:4px}
#isTools .ib{flex-direction:column;gap:2px;font-size:10.5px;padding:7px 6px;min-width:62px}
#isTools .sep{width:auto;height:1px;margin:3px 4px}
.tdot{width:18px;height:4px;border-radius:2px;background:currentColor}
.ib.ty.t-therefore{color:var(--therefore)} .ib.ty.t-because{color:var(--because)} .ib.ty.t-but{color:var(--but)}
.ib.ty{opacity:.55}.ib.ty.on{opacity:1;background:var(--hover);box-shadow:inset 0 0 0 1.5px currentColor}
.tcap{font-size:10px;color:var(--muted);text-align:center;padding:0 2px}
#isZoom{right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px))}
#zoomVal{min-width:46px;text-align:center;font-size:12.5px;font-variant-numeric:tabular-nums;color:var(--muted)}
#isLegend{left:max(16px,env(safe-area-inset-left,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));padding:6px 12px;gap:10px;font-size:12px;color:var(--muted);flex-wrap:wrap;max-width:calc(100% - 260px)}
#isLegend span{display:inline-flex;align-items:center;gap:5px}
#isLegend b{color:var(--ink);font-weight:600}

/* ---------- project manager ---------- */
#pm{position:fixed;z-index:8;top:calc(62px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));width:340px;max-width:calc(100% - 32px);
  max-height:calc(100% - 90px);overflow:auto;background:var(--panel);border-radius:12px;box-shadow:var(--shadow);padding:14px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px}
.pm-sec{font-size:11px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.tree{display:flex;flex-direction:column;gap:4px}
.tp{border:1px solid var(--rule);border-radius:9px;padding:4px}
.tp.cur{border-color:var(--accent)}
.tp-h{display:flex;width:100%;justify-content:space-between;align-items:center;border:0;background:transparent;padding:7px 8px;border-radius:6px;font-weight:600;font-size:13.5px;text-align:left;gap:8px}
.tp-h:hover{background:var(--hover)}
.tp-h span:first-child{min-width:0;overflow-wrap:anywhere}
.tv{display:flex;width:100%;align-items:center;gap:8px;border:0;background:transparent;padding:6px 8px 6px 18px;border-radius:6px;font-size:13px;text-align:left}
.tv:hover{background:var(--hover)}
.tv.on{background:var(--hover);color:var(--accent);font-weight:600}
.tv .muted{margin-left:auto;font-variant-numeric:tabular-nums}
.tv .nt{color:var(--muted);font-weight:400;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0;flex:1}

/* ---------- side panels ---------- */
.side{position:fixed;z-index:6;top:calc(64px + env(safe-area-inset-top,0px));right:max(16px,env(safe-area-inset-right,0px));
  width:330px;max-height:calc(100% - 140px);overflow:auto;background:var(--panel);border-radius:12px;box-shadow:var(--shadow);padding:16px;box-sizing:border-box;display:flex;flex-direction:column;gap:12px}
.side h2{font-size:13px;margin:0;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);display:flex;justify-content:space-between;align-items:center}
.x{border:0;background:transparent;font-size:20px;line-height:1;padding:2px 6px;border-radius:6px;color:var(--muted)}
.x:hover{background:var(--hover)}
.fld{display:flex;flex-direction:column;gap:4px;min-width:0}
.fld label{font-size:11.5px;font-weight:500;color:var(--muted)}
.fld input,.fld textarea,.fld select,.inp{font:inherit;font-size:14px;color:var(--ink);background:var(--field);border:1px solid var(--rule);border-radius:7px;padding:8px 10px;width:100%;box-sizing:border-box}
#fNum{font-family:var(--f-slug);font-weight:700;width:90px}
#fHead{font-family:var(--f-slug);font-weight:700;text-transform:uppercase}
#fBody,#cDesc{min-height:130px;resize:vertical;line-height:1.45}
.conns{display:flex;flex-direction:column;gap:6px;font-size:13px}
.conn{display:flex;gap:8px;align-items:baseline;line-height:1.35}
.conn b{font-size:10.5px;letter-spacing:.08em;flex:none}
.conn b.t-therefore{color:var(--therefore)} .conn b.t-because{color:var(--because)} .conn b.t-but{color:var(--but)}
.conn span{min-width:0;overflow-wrap:anywhere}
.muted{color:var(--muted);font-size:12.5px}
.btn{border:1px solid var(--rule);background:var(--panel);border-radius:8px;padding:8px 12px;font-size:13px;font-weight:500}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--but);border-color:currentColor}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fl-item{display:flex;flex-direction:column;gap:3px;padding:10px;border-radius:8px;border:1px solid var(--rule);cursor:pointer;text-align:left;background:transparent}
.fl-item:hover{background:var(--hover)}
.fl-h{display:flex;gap:8px;align-items:baseline;font-family:var(--f-slug);font-weight:700;font-size:13px;text-transform:uppercase}
.fl-b{font-size:12.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.fl-l{font-size:12px;display:flex;flex-wrap:wrap;gap:4px 10px}
.warn{color:var(--but);font-size:11px;font-weight:600;letter-spacing:.04em}
#pop{position:fixed;z-index:7;background:var(--panel);border-radius:10px;box-shadow:var(--shadow);padding:4px;display:flex;gap:2px;flex-wrap:wrap;transform:translate(-50%,calc(-100% - 14px))}
#pop .ib.t-therefore{color:var(--therefore)} #pop .ib.t-because{color:var(--because)} #pop .ib.t-but{color:var(--but)}

/* ---------- pages: story & characters ---------- */
.page{position:fixed;inset:0;overflow:auto;background:var(--bg);z-index:3;
  padding-top:calc(84px + env(safe-area-inset-top,0px));padding-bottom:calc(48px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));box-sizing:border-box}
.ms{max-width:760px;margin:0 auto;background:var(--panel);box-shadow:var(--shadow);border-radius:4px;padding:48px clamp(20px,6vw,72px) 56px;box-sizing:border-box;display:flex;flex-direction:column;gap:22px}
.ms .eyebrow{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ms h1{margin:0;font-family:var(--f-slug);font-size:clamp(24px,4vw,32px);text-transform:uppercase;letter-spacing:.02em;text-wrap:balance}
.ms label{font-size:11.5px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ms textarea{font-family:var(--f-read);color:var(--ink);background:transparent;border:0;border-radius:4px;padding:6px 8px;margin:0 -8px;resize:none;width:calc(100% + 16px);box-sizing:border-box;overflow:hidden}
.ms textarea:hover{background:var(--field)}
.ms textarea:focus{background:var(--field);outline:none;box-shadow:inset 0 0 0 1px var(--rule)}
#sLog{font-size:19px;line-height:1.55;font-style:italic}
#sStory{font-size:17px;line-height:1.75;min-height:320px}
.stats{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;display:flex;gap:14px;flex-wrap:wrap;border-top:1px solid var(--rule);padding-top:12px}

.cwrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
.chead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.chead h1{margin:0;font-size:22px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.ccard{background:var(--panel);border-radius:10px;box-shadow:var(--shadow);overflow:hidden;display:flex;flex-direction:column;cursor:pointer;border:2px solid transparent;text-align:left;padding:0}
.ccard:hover{border-color:var(--rule)}
.ccard.sel{border-color:var(--accent)}
.cimg{aspect-ratio:4/3;width:100%;max-width:100%;background:var(--hover);display:grid;place-items:center;overflow:hidden}
.cimg img{width:100%;height:100%;object-fit:cover;display:block}
.cini{font-family:var(--f-slug);font-weight:700;font-size:34px;color:var(--muted)}
.cinfo{padding:12px 14px 14px;display:flex;flex-direction:column;gap:6px;min-width:0}
.cname{font-weight:600;font-size:15.5px}
.cmeta{font-size:12.5px;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:4px}
.chip{font-size:11.5px;padding:2px 8px;border-radius:10px;background:var(--hover)}
.cdesc{font-size:13px;line-height:1.45;color:var(--ink);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.role{font-size:10.5px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.cprev{aspect-ratio:4/3;max-width:100%;border-radius:8px;background:var(--hover);display:grid;place-items:center;overflow:hidden}
.cprev img{width:100%;height:100%;object-fit:cover}

/* ---------- modal / toast ---------- */
#modal{position:fixed;inset:0;z-index:9;background:rgba(10,14,20,.42);display:grid;place-items:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mbox{background:var(--panel);border-radius:14px;box-shadow:var(--shadow);padding:20px;width:min(560px,100%);box-sizing:border-box;display:flex;flex-direction:column;gap:12px;max-height:85vh;overflow:auto}
.mbox h3{margin:0;font-size:17px}
.mbox p{margin:0;font-size:13.5px;line-height:1.5;color:var(--muted)}
.mbox textarea{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;height:200px;width:100%;box-sizing:border-box;background:var(--field);color:var(--ink);border:1px solid var(--rule);border-radius:8px;padding:10px;resize:vertical}
.opt{display:flex;gap:10px;align-items:flex-start;font-size:13.5px}
/* cloud: sync chip, account popover, login */
#syncBtn{font-size:12px;color:var(--muted);gap:6px;padding:6px 8px}
.sdot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
#syncBtn[data-s="saved"] .sdot{background:#2f9e5b} #syncBtn[data-s="saving"] .sdot,#syncBtn[data-s="connecting"] .sdot{background:#d49b1a}
#syncBtn[data-s="offline"] .sdot,#syncBtn[data-s="signedout"] .sdot{background:var(--but)}
#acct{position:fixed;z-index:8;top:calc(62px + env(safe-area-inset-top,0px));left:max(16px,env(safe-area-inset-left,0px));width:340px;max-width:calc(100% - 32px);
  max-height:calc(100% - 90px);overflow:auto;background:var(--panel);border-radius:12px;box-shadow:var(--shadow);padding:14px;box-sizing:border-box;display:flex;flex-direction:column;gap:10px;font-size:13.5px}
.trow{display:flex;align-items:center;gap:8px;justify-content:space-between;padding:4px 0;border-bottom:1px solid var(--rule)}
.trow span{min-width:0;overflow-wrap:anywhere}
.hrow{display:flex;align-items:center;gap:10px;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.hrow .when{font-variant-numeric:tabular-nums;font-weight:500}
#login{position:fixed;inset:0;z-index:20;background:var(--bg);display:grid;place-items:center;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.lbox{width:min(400px,100%);background:var(--panel);border-radius:14px;box-shadow:var(--shadow);padding:28px;box-sizing:border-box;display:flex;flex-direction:column;gap:14px}
.lbox h2{margin:0;font-family:var(--f-slug);font-size:24px;text-transform:uppercase}
.lbox p{margin:0;line-height:1.5;color:var(--muted);font-size:14px}
.lbox form{display:flex;flex-direction:column;gap:10px}
.linkbtn{border:0;background:transparent;color:var(--muted);text-decoration:underline;font-size:12.5px;padding:4px 0;align-self:flex-start}
@media (max-width:900px){#syncBtn .tx{display:none}#acct{top:calc(112px + env(safe-area-inset-top,0px))}}
#toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);z-index:10;background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;box-shadow:var(--shadow);max-width:calc(100% - 32px)}

@media (max-width:900px){
  .ib .tx{display:none}
  #isTabs{top:calc(62px + env(safe-area-inset-top,0px))}
  #isProj{max-width:calc(100% - 210px)}
  #projBtn{max-width:150px}
  .page{padding-top:calc(124px + env(safe-area-inset-top,0px))}
  .side,#pm{top:calc(112px + env(safe-area-inset-top,0px))}
  #isLegend{display:none}
}
@media (max-width:640px){

<script>
(() => {
const KEY = 'szenenboard.v2', OLD_KEY = 'szenenboard.v1';
const TYPES = ['therefore', 'because', 'but'];
const VCOL = ['yellow', 'pink', 'blue', 'green', 'orange', 'purple'];
const VNAME = { yellow: 'Gelb', pink: 'Rosa', blue: 'Blau', green: 'Grün', orange: 'Orange', purple: 'Lila' };
const vcol = n => VCOL[(Math.max(1, n) - 1) % VCOL.length];
const $ = s => document.querySelector(s);
const vp = $('#viewport'), world = $('#world'), cardsEl = $('#cards'), labelsEl = $('#labels'), linkG = $('#linkG');
const uid = () => Math.random().toString(36).slice(2, 10);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const today = () => new Date().toISOString().slice(0, 10);
const fmtDate = d => { const [y, m, t] = String(d || '').split('-'); return t ? `${t}.${m}.${y}` : ''; };
const vdot = n => `<span class="vdot" style="background:var(--n-${vcol(n)})"></span>`;

/* ================= seed: Die Glamper ================= */
function glamper() {
  const sc = (num, heading, content, x, y) => ({ id: 'g' + num, num: String(num), heading, content, x, y, v: 1 });
  const T = 60, B = 440;
  const scenes = [
    sc(1, 'INT. WOHNUNG CLAUDIA & MARTIN, DEUTSCHLAND – ABEND', 'Claudia und Martin führen ihre Ehe wie ein Unternehmen: Es wird nicht gestritten, es wird sachlich verhandelt. Eine Diskussion wird doch emotional. Die logische, wirtschaftliche Lösung liegt auf dem Tisch: Trennung.', 0, T),
    sc(2, 'INT. BÜRO – TAG', 'Ein geschiedener Kollege rät Martin, endlich einmal zu leben.', 360, T),
    sc(3, 'EXT. WOHNMOBILHÄNDLER – TAG', 'Ein schmieriger Händler vermietet ihnen einen Luxus-Camper. Der hätte nur abgestellt werden sollen: Darin sind Kokain und Gras versteckt. Das Paar flüchtet vor seiner Entscheidung nach Vorarlberg.', 720, T),
    sc(4, 'INT. AUTO DER DEALER – TAG', 'Vater und Sohn, die eigentlichen Abholer, merken, dass der Camper weg ist. Als Angler getarnt nehmen sie die Spur auf.', 900, B),
    sc(5, 'EXT. CAMPINGPLATZ VORARLBERG – TAG', 'Statt Glamping: ein Campingplatz voller Menschen, die ganz anders leben. Dauercamper mit Dialekt, Hippies mit VW-Bus, zwei Dauerbetrunkene, Nachbarn mit Fäkalienkassette.', 1260, T),
    sc(6, 'EXT. CAMPINGPLATZ – TAG', 'Jugendliche verspotten das Paar und nennen sie „wie Eltern“. Das trifft, denn Kinder haben die beiden immer auf später verschoben.', 1620, T),
    sc(7, 'EXT. NACHBARPARZELLE – ABEND', 'Die netten Angler vom Nachbarplatz werden Freunde und geben dem Paar sogar Beziehungstipps. Das Publikum weiß, wer sie sind, das Paar nicht.', 1800, B),
    sc(8, 'EXT. LAGERFEUER – NACHT', 'Claudia und Martin lernen Feuer machen, reden mit anderen über den Partner und haben schließlich ihren ersten echten Streit. Furchtbar und befreiend.', 2160, T),
    sc(9, 'EXT. AUSFLUG MIT DEN JUGENDLICHEN – TAG', 'An einem getauschten Ausflugstag mit den Jugendlichen sehen sie ihre Ehe mit neuen Augen.', 2520, T),
    sc(10, 'INT. CAMPER – TAG', 'Die Dealer durchsuchen heimlich den Camper und stellen fest: Ein Paket fehlt.', 2700, B),
    sc(11, 'EXT. SEE / BOOT – TAG', 'Bootsausflug. Die Dealer wollen Martin aushorchen, er hält das Ganze für ein absurdes Männerritual.', 3060, B),
    sc(12, 'INT. CAMPER – NACHT', 'Die Jugendlichen finden im Camper statt Mehl weißes Pulver. Es folgt die wildeste Nacht im Leben des Paares.', 3240, T),
    sc(13, 'EXT. CAMPINGPLATZ – NACHT', 'Die Tarnung fällt. Claudia und Martin stellen sich mit dem ganzen Campingplatz den Dealern, mit allem, was sie hier gelernt haben. Als sie die Jugendlichen beschützen, rufen sie: „Das sind unsere Kinder!“ Und meinen es so.', 3600, T),
    sc(14, 'INT. EIGENHEIM, DEUTSCHLAND – TAG', 'Claudia und Martin entscheiden sich, zu fühlen statt zu rechnen. Das Eigenheim, früher kühl und symmetrisch, wirkt jetzt warm und einladend.', 3960, T),
    sc(15, 'EXT. WOHNMOBILHÄNDLER – TAG', 'Der Camper geht zurück an einen Händler mit blauen Flecken im Gesicht.', 3960, B)
  ];
  const L = (f, t, type) => ({ id: `l${f}-${t}`, from: 'g' + f, to: 'g' + t, type });
  const links = [L(1, 2, 'but'), L(2, 3, 'therefore'), L(3, 4, 'therefore'), L(3, 5, 'but'), L(5, 6, 'therefore'), L(4, 7, 'therefore'),
    L(7, 8, 'therefore'), L(8, 9, 'therefore'), L(7, 10, 'therefore'), L(10, 11, 'therefore'), L(11, 12, 'but'), L(12, 10, 'because'),
    L(12, 13, 'therefore'), L(13, 14, 'therefore'), L(13, 15, 'therefore')];
  let chn = 0;
  const ch = (name, age, gender, role, traits, desc) => ({ id: 'gc' + (++chn), name, age, gender, role, traits, desc, image: '' });
  const characters = [
    ch('Claudia', 'um die 50', 'weiblich', 'Hauptfigur', 'erfolgreich, lösungsorientiert, kontrolliert', 'Aus Deutschland. Führt die Ehe mit Martin wie ein Verfahren und bricht ab, sobald es emotional wird. Muss lernen, zu fühlen statt zu rechnen. (Arbeitsname)'),
    ch('Martin', 'um die 50', 'männlich', 'Hauptfigur', 'erfolgreich, lösungsorientiert, kontrolliert', 'Aus Deutschland. Hört auf den Rat, endlich einmal zu leben, und mietet den Camper. Muss lernen, zu fühlen statt zu rechnen. (Arbeitsname)'),
    ch('Der Vater', '', 'männlich', 'Gegenspieler', 'ruhig, kennt die Regeln', 'Drogenkurier, getarnt als harmloser Angler. Gibt dem Paar ausgerechnet Beziehungstipps.'),
    ch('Der Sohn', '', 'männlich', 'Gegenspieler', 'ungeduldig, will abkürzen', 'Drogenkurier mit seinem Vater, getarnt als Angler.'),
    ch('Der Wohnmobilhändler', '', 'männlich', 'Nebenfigur', 'schmierig, geldgierig, ahnungslos', 'Wollte nur nebenbei ein paar Euro verdienen. Am Ende hat er blaue Flecken im Gesicht.'),
    ch('Der geschiedene Kollege', '', 'männlich', 'Nebenfigur', '', 'Rät Martin, endlich einmal zu leben, und stößt damit die Flucht an.'),
    ch('Die Jugendlichen', '', '', 'Ensemble', 'frech, spöttisch', 'Erst verspotten sie das Paar als „wie Eltern“, am Ende sind sie die Kinder, die es beschützt.'),
    ch('Der Campingplatz', '', '', 'Ensemble', 'grantig, laut, herzlich', 'Ein grantiges Dauercamper-Paar mit Vorarlberger Dialekt, Hippies mit VW-Bus, zwei Dauerbetrunkene und Nachbarn mit Fäkalienkassette. Zusammen werden sie zur Gemeinschaft, die das Paar rettet.')
  ];
  const story = [
    'Akt 1: Die vernünftige Lösung',
    'Claudia und Martin, beide um die fünfzig, haben alles erreicht. Ihre Ehe führen sie wie ein Unternehmen: Gestritten wird nicht, es wird sachlich verhandelt. Als eine Diskussion doch emotional wird, liegt die logische, wirtschaftliche Lösung auf dem Tisch. Sie sollten sich trennen, damit jeder herausfindet, was ihm wichtig ist. Doch Martin hört von einem geschiedenen Kollegen, er solle endlich einmal leben. Ein schmieriger Händler vermietet ihm einen Luxus-Camper, und die beiden flüchten vor ihrer Entscheidung nach Vorarlberg. Was sie nicht wissen: Der Camper hätte beim Händler nur abgestellt werden sollen, und in ihm sind Kokain und Gras versteckt. Seine eigentlichen Abholer, Vater und Sohn, machen sich als Angler getarnt auf den Weg.',
    '', 'Akt 2: Das Gegenteil von Glamping',
    'Statt Luxus wartet ein Campingplatz voller Menschen, die ganz anders leben: Dauercamper, Hippies, Jugendliche, die das Paar spöttisch „wie Eltern“ nennen. Das trifft, denn Kinder haben die beiden immer auf später verschoben. Die netten Angler vom Nachbarplatz werden Freunde und geben sogar Beziehungstipps. Das Publikum weiß, wer sie sind, das Paar nicht. Claudia und Martin lernen Feuer machen, reden mit anderen über den Partner und haben schließlich ihren ersten echten Streit, furchtbar und befreiend. An einem getauschten Ausflugstag mit den Jugendlichen sehen sie ihre Ehe mit neuen Augen. Derweil durchsuchen die Dealer den Camper und stellen fest: Ein Paket fehlt.',
    '', 'Akt 3: Das sind unsere Kinder',
    'Ein Bootsausflug, bei dem die Dealer Martin aushorchen wollen, hält er für ein absurdes Männerritual. Dann finden die Jugendlichen im Camper statt Mehl weißes Pulver, und es folgt die wildeste Nacht im Leben des Paares. Als die Tarnung fällt, stellen sich Claudia und Martin gemeinsam mit dem ganzen Campingplatz den Dealern, mit allem, was sie hier gelernt haben. Als sie die Jugendlichen beschützen, rufen sie: „Das sind unsere Kinder!“ Und meinen es so.',
    '', 'Ende',
    'Claudia und Martin entscheiden sich, zu fühlen statt zu rechnen. Sie erkennen, dass der Wert des Lebens in den Menschen liegt, mit denen man Zeit verbringt, und in Momenten, die man gemeinsam erlebt, nicht im Büro. Der Camper geht zurück an einen Händler mit blauen Flecken im Gesicht.'
  ].join('\n');
  const logline = 'Ein deutsches Karriere-Ehepaar steht vor der vernünftigsten Entscheidung seines Lebens, der Trennung, und läuft davon. Ein gemieteter Luxus-Camper bringt die beiden auf einen Vorarlberger Campingplatz voller Menschen, die ganz anders leben als sie. Mit dabei: zwei freundliche Angler, die etwas suchen, das im Camper versteckt ist.';
  const p = mkProject('Die Glamper', { logline, story, scenes, links, characters, view: null });
  p.id = 'glamper'; p.versions[0].id = 'glamper-v1'; p.activeVersion = 'glamper-v1';
  p.versions[0].note = 'Aus dem Treatment übernommen';
  return p;
}

/* ================= store ================= */
function emptyData() { return { logline: '', story: '', scenes: [], links: [], characters: [], view: null }; }
function mkProject(name, data) {
  const vid = uid();
  return { id: uid(), name, activeVersion: vid, versions: [{ id: vid, n: 1, created: today(), note: '', data: normData(data || emptyData()) }] };
}
function normData(d) {
  d = d || {};
  const ids = new Set();
  const scenes = (Array.isArray(d.scenes) ? d.scenes : []).map((s, i) => {
    const id = String(s.id || uid()); ids.add(id);
    return { id, num: String(s.num ?? i + 1), heading: String(s.heading ?? ''), content: String(s.content ?? ''),
      x: Number(s.x) || 0, y: Number(s.y) || 0, v: Math.max(1, parseInt(s.v, 10) || 1) };
  });
  const links = (Array.isArray(d.links) ? d.links : []).filter(l => ids.has(String(l.from)) && ids.has(String(l.to)))
    .map(l => ({ id: String(l.id || uid()), from: String(l.from), to: String(l.to), type: TYPES.includes(l.type) ? l.type : 'therefore' }));
  const characters = (Array.isArray(d.characters) ? d.characters : []).map(c => ({
    id: String(c.id || uid()), name: String(c.name ?? ''), age: String(c.age ?? ''), gender: String(c.gender ?? ''), role: String(c.role ?? ''),
    traits: String(c.traits ?? ''), desc: String(c.desc ?? ''), image: typeof c.image === 'string' && /^(data:image\/|https:\/\/)/.test(c.image) ? c.image : '' }));
  const view = d.view && isFinite(d.view.z) ? { x: +d.view.x || 0, y: +d.view.y || 0, z: +d.view.z || 1 } : null;
  return { logline: String(d.logline ?? ''), story: String(d.story ?? ''), scenes, links, characters, view };
}
function normProject(p) {
  const versions = (Array.isArray(p.versions) ? p.versions : []).map((v, i) => ({ id: String(v.id || uid()), n: parseInt(v.n, 10) || i + 1,
    created: String(v.created || today()), note: String(v.note ?? ''), data: normData(v.data) }));
  if (!versions.length) return mkProject(String(p.name || 'Projekt'));
  const av = versions.some(v => v.id === p.activeVersion) ? p.activeVersion : versions[versions.length - 1].id;
  return { id: String(p.id || uid()), name: String(p.name || 'Projekt'), activeVersion: av, versions };
}
function loadStore() {
  try {
    const raw = localStorage.getItem(KEY);

async function saveFile(name, data) {
  if (window.claude && typeof window.claude.use === 'function') {
    try {
      const dl = await window.claude.use('downloads');
      if (dl) { await dl.save({ filename: name, data }); toast('Gespeichert'); return; }
    } catch (e) { if (e && e.code === 'declined') { toast('Speichern abgebrochen'); return; } }
  }
  const blob = data instanceof Blob ? data : new Blob([data], { type: name.endsWith('.json') ? 'application/json' : 'application/octet-stream' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}
const slug = s => (s || 'projekt').toLowerCase().replace(/[^a-z0-9äöüß]+/gi, '-').replace(/^-|-$/g, '') || 'projekt';

    s.onload = res; s.onerror = () => rej(new Error('jspdf')); document.head.append(s);

}

async function imgData(src) {
  if (!src || src.startsWith('data:')) return src || '';
  try { const r = await fetch(src); const b = await r.blob(); return await new Promise(res => { const fr = new FileReader(); fr.onload = () => res(fr.result); fr.onerror = () => res(''); fr.readAsDataURL(b); }); }
  catch (e) { return ''; }
}
function buildPDF(o, imgs = {}) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const p = P(), v = V(), d = v.data;
  const W = 210, H = 297, M = 22, CW = W - 2 * M, PT = 0.3528;
  const INK = [30, 35, 43], MUTE = [105, 112, 125], ACC = [56, 89, 214];
  const TC = { therefore: [56, 89, 214], because: [194, 106, 0], but: [194, 51, 77] };
  const clean = t => String(t || '').replace(/⇄/g, '<->').replace(/→/g, '->').replace(/[^\x09\x0A\x0D\x20-\x7E -ÿ–—‘’‚“”„•…€]/g, '');
  let y = M;
  const need = h => { if (y + h > H - M) { doc.addPage(); y = M; } };
  function txt(t, { size = 11, font = 'helvetica', style = 'normal', color = INK, lh = 1.45, indent = 0, after = 2, width } = {}) {
    doc.setFont(font, style); doc.setFontSize(size); doc.setTextColor(...color);
    const lines = doc.splitTextToSize(clean(t), (width || CW) - indent), step = size * PT * lh;
    for (const ln of lines) { need(step); doc.text(ln, M + indent, y + size * PT); y += step; }
    y += after;
  }
  function section(title) {
    doc.addPage(); y = M;
    txt(title.toUpperCase(), { size: 9, style: 'bold', color: ACC, after: 1 });
    doc.setDrawColor(...ACC); doc.setLineWidth(0.5); doc.line(M, y, M + 18, y); y += 8;
  }
  // cover
  y = 90;
  txt('DREHBUCH-VORBEREITUNG', { size: 9, style: 'bold', color: ACC, after: 6 });
  txt(p.name, { size: 30, font: 'courier', style: 'bold', lh: 1.2, after: 6 });
  txt(`Version V${v.n}${v.note ? ' · ' + v.note : ''}`, { size: 12, color: MUTE, after: 1 });
  txt(`Stand ${fmtDate(today())} · ${d.scenes.length} Szenen · ${d.characters.length} Figuren`, { size: 12, color: MUTE, after: 14 });
  if (d.logline) { txt('LOGLINE', { size: 9, style: 'bold', color: MUTE, after: 2 }); txt(d.logline, { size: 12.5, style: 'italic', lh: 1.5 }); }
  if (o.story && d.story.trim()) {
    section('Hauptstory');
    for (const para of d.story.split('\n')) {
      if (!para.trim()) { y += 3; continue; }
      const isHead = para.length < 70 && !/[.!?“"]$/.test(para.trim());
      if (isHead) { need(14); txt(para, { size: 12, style: 'bold', after: 1.5 }); }
      else txt(para, { size: 11, lh: 1.6, after: 2.5 });
    }
  }
  if (o.chars && d.characters.length) {
    section('Figuren');
    for (const c of d.characters) {
      const img = imgs[c.id] ?? c.image, imgW = 30, imgH = 22.5, hasImg = !!img && img.startsWith('data:');
      need(32);
      const top = y, ind = hasImg ? imgW + 6 : 0;
      if (hasImg) { try { doc.addImage(img, img.startsWith('data:image/png') ? 'PNG' : 'JPEG', M, y, imgW, imgH); } catch (e) {} }
      txt(c.name || 'Ohne Namen', { size: 13, style: 'bold', indent: ind, after: 0.5 });
      const meta = [c.role, c.age, c.gender].filter(Boolean).join(' · ');
      if (meta) txt(meta, { size: 9.5, color: MUTE, indent: ind, after: 1 });
      if (traitList(c.traits).length) txt('Eigenschaften: ' + traitList(c.traits).join(', '), { size: 10, indent: ind, after: 1 });
      if (c.desc) txt(c.desc, { size: 10.5, lh: 1.5, indent: ind, after: 1 });
      const sc = charScenes(c); if (sc.length) txt('Kommt vor in Szene ' + sc.map(s => s.num).join(', '), { size: 9, color: MUTE, indent: ind, after: 1 });
      if (hasImg && y < top + imgH + 2) y = top + imgH + 2;
      y += 5;
    }
  }
  const sorted = [...d.scenes].sort(natCmp);
  if (o.list && sorted.length) {
    section('Szenenübersicht');
    for (const s of sorted) {
      need(7);
      doc.setFont('courier', 'bold'); doc.setFontSize(10.5); doc.setTextColor(...INK);
      doc.text(clean(s.num), M, y + 10.5 * PT);
      txt(s.heading || 'ohne Überschrift', { size: 10.5, font: 'courier', style: 'bold', indent: 12, after: 1.6 });
    }
  }
  if (o.scenes && sorted.length) {
    section('Szenen');
    for (const s of sorted) {
      need(30);
      doc.setDrawColor(225); doc.setLineWidth(0.2); doc.line(M, y, W - M, y); y += 5;
      doc.setFont('courier', 'bold'); doc.setFontSize(16); doc.setTextColor(...INK); doc.text(clean(s.num), M, y + 16 * PT * .8);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(8.5); doc.setTextColor(...MUTE); doc.text('V' + s.v, W - M, y + 3, { align: 'right' });
      txt(s.heading || 'ohne Überschrift', { size: 12, font: 'courier', style: 'bold', indent: 14, after: 2 });
      if (s.content) txt(s.content, { size: 11, lh: 1.55, indent: 14, after: 2 });
      const inc = d.links.filter(l => l.to === s.id), out = d.links.filter(l => l.from === s.id);
      for (const l of inc) { const a = sceneById(l.from); if (a) txt(`Folgt auf ${a.num} (${l.type.toUpperCase()}): ${a.heading}`, { size: 9, color: MUTE, indent: 14, after: 0.6 }); }
      for (const l of out) { const b = sceneById(l.to); if (b) txt(`${l.type.toUpperCase()} » ${b.num}: ${b.heading}`, { size: 9.5, style: 'bold', color: TC[l.type], indent: 14, after: 0.6 }); }
      y += 6;
    }
  }
  const n = doc.getNumberOfPages();
  for (let i = 2; i <= n; i++) {
    doc.setPage(i); doc.setFont('helvetica', 'normal'); doc.setFontSize(8); doc.setTextColor(...MUTE);
    doc.text(clean(`${p.name} · V${v.n}`), M, H - 12); doc.text(`${i - 1} / ${n - 1}`, W - M, H - 12, { align: 'right' });
  }
  return doc.output('blob');
}

const H = o => JSON.stringify(o);
const pPay = p => ({ name: p.name });
const vPay = (p, v) => { const { view: _v, ...data } = v.data; return { project_id: p.id, n: v.n, note: v.note, created: v.created, data }; };
const fromRow = (r, view) => ({ id: r.id, n: r.n, note: r.note || '', created: String(r.created || today()).slice(0, 10), data: { ...normData(r.data), view: view || null } });

const STATUS = { local: 'Nur dieser Browser', connecting: 'Verbinde …', saving: 'Speichert …', saved: 'Online gespeichert', offline: 'Offline, wird nachgeholt', signedout: 'Nicht angemeldet' };
let status = 'local';
function setStatus(s) { status = s; const b = $('#syncBtn'); b.dataset.s = s; $('#syncTx').textContent = STATUS[s]; b.title = STATUS[s]; if (!$('#acct').hidden) renderAcct(); }

function markDeleted(kind, id) { if (live || (kind === 'p' ? sync.p[id] : sync.v[id])) pendingDel[kind].add(id); }
function schedulePush() {
  if (!live) return;
  clearTimeout(pushT); setStatus('saving');
  pushT = setTimeout(push, 1200);
}
async function push() {
  if (!live) return;
  if (pushing) { pushAgain = true; return; }
  pushing = true;
  try {
    const now = new Date().toISOString(), by = me.email, meta = { updated_at: now, updated_by: by, client_id: CLIENT_ID };
    const pRows = [], vRows = [], pH = {}, vH = {};
    for (const p of store.projects) {
      const pp = pPay(p), h = H(pp);
      if (sync.p[p.id] !== h) { pRows.push({ id: p.id, ...pp, deleted: false, ...meta }); pH[p.id] = h; }
      for (const v of p.versions) {
        const vp = vPay(p, v), h2 = H(vp);
        if (sync.v[v.id] !== h2) { vRows.push({ id: v.id, ...vp, deleted: false, ...meta }); vH[v.id] = h2; }
      }
    }
    if (pRows.length) { const { error } = await sb.from('projects').upsert(pRows); if (error) throw error; Object.assign(sync.p, pH); }
    if (vRows.length) { const { error } = await sb.from('versions').upsert(vRows); if (error) throw error; Object.assign(sync.v, vH); }
    for (const id of [...pendingDel.v]) {
      const { error } = await sb.from('versions').update({ deleted: true, ...meta }).eq('id', id); if (error) throw error;
      pendingDel.v.delete(id); delete sync.v[id];
    }
    for (const id of [...pendingDel.p]) {
      const { error } = await sb.from('projects').update({ deleted: true, ...meta }).eq('id', id); if (error) throw error;
      pendingDel.p.delete(id); delete sync.p[id];
    }
    saveSync(); setStatus('saved');
  } catch (e) {
    console.warn('Speichern fehlgeschlagen', e); setStatus('offline');
    clearTimeout(pushT); pushT = setTimeout(push, 10000);
  }
  pushing = false;
  if (pushAgain) { pushAgain = false; push(); }
}

/* merge the server's projects into the local store */
function mergeCloud(pRows, vRows) {
  if (!pRows.some(r => !r.deleted)) { sync = { p: {}, v: {} }; saveSync(); return []; } // first person online: upload everything
  const localP = new Map(store.projects.map(p => [p.id, p]));
  const out = [], conflicts = [];
  const rowsByP = new Map();
  for (const r of vRows) { if (!rowsByP.has(r.project_id)) rowsByP.set(r.project_id, []); rowsByP.get(r.project_id).push(r); }
  for (const r of [...pRows].sort((a, b) => String(a.created_at).localeCompare(String(b.created_at)))) {
    const lp = localP.get(r.id); localP.delete(r.id);
    if (r.deleted) { delete sync.p[r.id]; continue; }
    const rvs = rowsByP.get(r.id) || [];
    if (!lp) {
      if (sync.p[r.id]) { pendingDel.p.add(r.id); continue; }       // deleted here while offline
      const versions = rvs.filter(x => !x.deleted).map(x => fromRow(x)).sort((a, b) => a.n - b.n);
      if (!versions.length) continue;
      versions.forEach(v => sync.v[v.id] = H(vPay({ id: r.id }, v)));
      const np = { id: r.id, name: r.name || 'Projekt', activeVersion: versions[versions.length - 1].id, versions };
      sync.p[r.id] = H(pPay(np)); out.push(np); continue;
    }
    const p = lp;
    if (!sync.p[p.id] || sync.p[p.id] === H(pPay(p))) { p.name = r.name || p.name; sync.p[p.id] = H(pPay(p)); }
    const lv = new Map(p.versions.map(v => [v.id, v])), versions = [];
    for (const rv of rvs) {
      const v = lv.get(rv.id); lv.delete(rv.id);
      if (rv.deleted) { delete sync.v[rv.id]; continue; }
      if (!v) { if (sync.v[rv.id]) { pendingDel.v.add(rv.id); continue; } const cv = fromRow(rv); sync.v[cv.id] = H(vPay(p, cv)); versions.push(cv); continue; }
      const cv = fromRow(rv, v.data.view), cloudH = H(vPay(p, cv)), localH = H(vPay(p, v));
      if (!sync.v[v.id] || localH === sync.v[v.id] || localH === cloudH) { sync.v[v.id] = cloudH; versions.push(cv); continue; }
      if (cloudH === sync.v[v.id]) { versions.push(v); continue; }      // only changed here: keep, upload
      sync.v[v.id] = cloudH; versions.push(cv); conflicts.push({ p, data: v.data }); // changed on both sides
    }
    for (const v of lv.values()) if (!sync.v[v.id]) versions.push(v);   // new here, not yet uploaded
    if (!versions.length) continue;
    p.versions = versions.sort((a, b) => a.n - b.n);
    out.push(p);
  }
  for (const p of localP.values()) if (!sync.p[p.id] && !(store.fresh && p.id === 'glamper')) out.push(p);
  for (const c of conflicts) {
    const n = Math.max(...c.p.versions.map(x => x.n)) + 1;
    c.p.versions.push({ id: uid(), n, created: today(), note: `Offline-Stand von ${me.email}`, data: c.data });
  }
  store.projects = out;
  store.fresh = false;
  saveSync();
  return conflicts;
}

async function fetchAll() {
  const [pr, vr] = await Promise.all([sb.from('projects').select('*'), sb.from('versions').select('*')]);
  if (pr.error) throw pr.error;
  if (vr.error) throw vr.error;
  return [pr.data || [], vr.data || []];
}
async function startSync() {
  if (syncing) return; syncing = true;
  try {
    setStatus('connecting');
    const { data: ok, error: e0 } = await sb.rpc('is_member');
    if (e0) throw e0;
    if (!ok) { showLogin('denied'); return; }
    hideLogin();
    const [pRows, vRows] = await fetchAll();
    const conflicts = mergeCloud(pRows, vRows);
    live = true; refreshAll(); subscribe(); await push();
    if (conflicts.length) toast(`${conflicts.length} offline geänderte Version(en) wurden als neue Version gesichert.`);
  } catch (e) { syncFail(e); }
  finally { syncing = false; }
}
async function resync() {
  if (!me || syncing) return; syncing = true;
  try { const [pRows, vRows] = await fetchAll(); const c = mergeCloud(pRows, vRows); live = true; refreshAll(); await push(); if (c.length) toast(`${c.length} offline geänderte Version(en) wurden als neue Version gesichert.`); }
  catch (e) { syncFail(e); }
  finally { syncing = false; }
}
function syncFail(e) {
  console.warn('Online-Speicherung nicht erreichbar', e);
  live = false; setStatus('offline');
  clearTimeout(retryT); retryT = setTimeout(() => { if (me) resync(); }, 15000);
}

let channel = null, wasDown = false;
function subscribe() {
  if (channel) return;
  channel = sb.channel('szenenboard')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'versions' }, ev => onRemoteVersion(ev.new || {}))
    .on('postgres_changes', { event: '*', schema: 'public', table: 'projects' }, ev => onRemoteProject(ev.new || {}))
    .subscribe(st => {
      if (st === 'SUBSCRIBED') { if (wasDown) { wasDown = false; resync(); } }
      else if (st === 'CHANNEL_ERROR' || st === 'TIMED_OUT' || st === 'CLOSED') wasDown = true;
    });
}
addEventListener('online', () => { if (me) resync(); });
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && me && live) resync(); });

async function onRemoteProject(r) {
  if (!r.id || r.client_id === CLIENT_ID) return;
  const p = store.projects.find(x => x.id === r.id);
  if (r.deleted) { if (p) { store.projects = store.projects.filter(x => x.id !== r.id); delete sync.p[r.id]; saveSync(); refreshAll(); toast(`„${p.name}“ wurde gelöscht`); } return; }
  if (p) {
    if (sync.p[p.id] === H(pPay(p))) { p.name = r.name; sync.p[p.id] = H(pPay(p)); saveSync(); refreshAll(); }
    return;
  }
  const { data, error } = await sb.from('versions').select('*').eq('project_id', r.id);
  if (error || !data) return;
  const versions = data.filter(x => !x.deleted).map(x => fromRow(x)).sort((a, b) => a.n - b.n);
  if (!versions.length || store.projects.some(x => x.id === r.id)) return;
  const np = { id: r.id, name: r.name, activeVersion: versions[versions.length - 1].id, versions };
  versions.forEach(v => sync.v[v.id] = H(vPay(np, v))); sync.p[np.id] = H(pPay(np));
  store.projects.push(np); saveSync(); refreshAll();
}
async function onRemoteVersion(ev) {
  if (!ev.id || ev.client_id === CLIENT_ID) return;
  if (mode) { setTimeout(() => onRemoteVersion(ev), 600); return; }   // finish the drag first
  const p = store.projects.find(x => x.id === ev.project_id);
  if (!p) return;   // the project event brings it
  let v = p.versions.find(x => x.id === ev.id);
  if (ev.deleted) {
    if (v) { p.versions = p.versions.filter(x => x.id !== ev.id); delete sync.v[ev.id]; if (!p.versions.length) store.projects = store.projects.filter(x => x !== p); saveSync(); refreshAll(); }
    return;
  }
  const { data, error } = await sb.from('versions').select('*').eq('id', ev.id);
  if (error || !data || !data[0]) return;
  const r = data[0];
  v = p.versions.find(x => x.id === r.id);
  if (!v) { const cv = fromRow(r); p.versions.push(cv); p.versions.sort((a, b) => a.n - b.n); sync.v[cv.id] = H(vPay(p, cv)); saveSync(); refreshAll(); return; }
  if (H(vPay(p, v)) !== sync.v[v.id]) {   // edited here at the same moment: ours goes up, theirs stays in the history
    if (!warnedConflict) { warnedConflict = true; toast(`${r.updated_by || 'Jemand'} hat gleichzeitig an V${v.n} gearbeitet. Der andere Stand liegt im Verlauf.`); }
    return;
  }
  const cv = fromRow(r, v.data.view);
  Object.assign(v, { n: cv.n, note: cv.note, created: cv.created, data: cv.data });
  sync.v[v.id] = H(vPay(p, v)); saveSync(); refreshAll();
}

function refreshAll() {
  if (!store.projects.length) { const np = mkProject('Neues Projekt'); store.projects.push(np); }
  if (!store.projects.some(p => p.id === store.active)) store.active = store.projects[0].id;
  const p = P();
  if (!p.versions.some(v => v.id === p.activeVersion)) p.activeVersion = p.versions[p.versions.length - 1].id;
  saveLocal();
  renderHeader();
  if (!$('#pm').hidden) renderPM();
  if (store.tab === 'board') {
    if (sel && sel.kind === 'scene' && !sceneById(sel.id)) select(null);
    else if (sel && sel.kind === 'link' && !D().links.some(l => l.id === sel.id)) select(null);
    else { render(); if (sel && sel.kind === 'scene') fillPanel(); }
    renderFlow();
  }
  if (store.tab === 'story') renderStory();
  if (store.tab === 'chars') {
    if (charSel && !charById(charSel)) { charSel = null; $('#charPanel').hidden = true; }
    if (charSel) openChar(charSel); else renderChars();
  }
}

/* images go to the shared storage when online */
async function storeImage(cv) {
  if (live) {
    try {
      const blob = await new Promise(r => cv.toBlob(r, 'image/jpeg', 0.82));
      const path = `${uid()}${uid()}.jpg`;
      const { error } = await sb.storage.from('bilder').upload(path, blob, { contentType: 'image/jpeg' });
      if (error) throw error;
      return sb.storage.from('bilder').getPublicUrl(path).data.publicUrl;
    } catch (e) { console.warn(e); toast('Bild konnte nicht hochgeladen werden. Es wird direkt im Projekt gespeichert.'); }
  }
  return cv.toDataURL('image/jpeg', 0.82);
}

/* history */
const fmtDT = iso => new Date(iso).toLocaleString('de-AT', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
async function openHistory() {
  closePM();
  const p = P(), v = V();
  openModal(`<h3>Verlauf von V${v.n}</h3>
    <p>Frühere Stände dieser Version. Ein Stand wird festgehalten, wenn nach mehr als 10 Minuten weitergearbeitet wird oder jemand anderer weiterschreibt. Zurückholen legt eine neue Version an, der jetzige Stand bleibt also erhalten.</p>
    <div id="hList"><div class="muted">Lädt …</div></div>
    <div class="row"><button class="btn" data-close>Schließen</button></div>`);
  const { data, error } = await sb.from('history').select('id,saved_at,saved_by').eq('version_id', v.id).order('saved_at', { ascending: false }).limit(200);
  const box = $('#hList'); if (!box) return;
  if (error) { box.innerHTML = '<div class="muted">Der Verlauf konnte nicht geladen werden. Bitte Verbindung prüfen.</div>'; return; }
  if (!data.length) { box.innerHTML = '<div class="muted">Noch keine früheren Stände. Der erste entsteht, sobald an dieser Version weitergearbeitet wird.</div>'; return; }
  box.innerHTML = data.map(r => `<div class="hrow"><span><span class="when">${fmtDT(r.saved_at)}</span> <span class="muted">${esc(r.saved_by || '')}</span></span><button class="btn" data-h="${esc(r.id)}" data-t="${esc(fmtDT(r.saved_at))}">Als neue Version zurückholen</button></div>`).join('');
  box.onclick = async e => {
    const b = e.target.closest('[data-h]'); if (!b) return;
    b.disabled = true; b.textContent = 'Lädt …';
    const { data: rows, error: e2 } = await sb.from('history').select('data').eq('id', b.dataset.h);
    if (e2 || !rows || !rows[0]) { b.disabled = false; b.textContent = 'Nochmal versuchen'; return; }
    const n = Math.max(...p.versions.map(x => x.n)) + 1;
    const nv = { id: uid(), n, created: today(), note: `Zurückgeholt: V${v.n} vom ${b.dataset.t}`, data: { ...normData(rows[0].data), view: v.data.view } };
    p.versions.push(nv); p.activeVersion = nv.id; store.active = p.id;
    closeModal(); save(); refreshAll(); toast(`Stand vom ${b.dataset.t} als V${n} zurückgeholt`);
  };
}

/* account & team popover */
function closeAcct() { $('#acct').hidden = true; }
$('#syncBtn').onclick = e => { e.stopPropagation(); closePM(); if ($('#acct').hidden) { $('#acct').hidden = false; renderAcct(); } else closeAcct(); };
document.addEventListener('pointerdown', e => { if (!$('#acct').hidden && !e.target.closest('#acct') && !e.target.closest('#syncBtn')) closeAcct(); });
async function renderAcct() {
  const box = $('#acct');
  if (!cloudOn) {
    box.innerHTML = `<div class="pm-sec">Speicherort</div><div>Alles wird nur in diesem Browser gespeichert. Mit „Sichern“ machst du ein Backup oder nimmst ein Projekt auf ein anderes Gerät mit.</div>`;
    return;
  }
  if (!me) {
    box.innerHTML = `<div class="pm-sec">Nicht angemeldet</div><div>Deine Änderungen bleiben gerade nur in diesem Browser. Melde dich an, damit sie online gespeichert und mit dem Team geteilt werden.</div><div class="row"><button class="btn pri" id="aLogin">Anmelden</button></div>`;
    $('#aLogin').onclick = () => { closeAcct(); showLogin(); };
    return;
  }
  box.innerHTML = `<div class="pm-sec">Angemeldet</div><div>${esc(me.email)}</div><div class="muted">${STATUS[status]}</div>
    <div class="pm-sec" style="margin-top:6px">Team</div><div class="muted">Alle hier sehen und bearbeiten alle Projekte.</div>
    <div id="aTeam"><div class="muted">Lädt …</div></div>
    <form class="row" id="aAdd"><input class="inp" type="email" id="aMail" required placeholder="E-Mail hinzufügen" style="flex:1;min-width:0" aria-label="E-Mail hinzufügen"><button class="btn">Hinzufügen</button></form>
    <div class="row"><button class="btn" id="aOut">Abmelden</button></div>`;
  $('#aOut').onclick = async () => { closeAcct(); await sb.auth.signOut(); };
  $('#aAdd').onsubmit = async e => {
    e.preventDefault(); const email = $('#aMail').value.trim().toLowerCase(); if (!email) return;
    const { error } = await sb.from('team_members').insert({ email });
    if (error && !/duplicate|unique/i.test(error.message || '')) { toast('Hinzufügen hat nicht geklappt: ' + error.message); return; }
    toast(`${email} hat jetzt Zugang. Schick ihr oder ihm den Link zur Seite.`); renderAcct();
  };
  const { data, error } = await sb.from('team_members').select('email').order('added_at');
  const t = $('#aTeam'); if (!t) return;
  if (error) { t.innerHTML = '<div class="muted">Team konnte nicht geladen werden.</div>'; return; }
  t.innerHTML = data.map(r => `<div class="trow"><span>${esc(r.email)}</span>${r.email.toLowerCase() === me.email.toLowerCase() ? '<span class="muted">du</span>' : `<button class="x" data-rm="${esc(r.email)}" aria-label="${esc(r.email)} entfernen" title="Entfernen">×</button>`}</div>`).join('');
  t.onclick = async e => {
    const b = e.target.closest('[data-rm]'); if (!b) return;
    const { error: e2 } = await sb.from('team_members').delete().eq('email', b.dataset.rm);
    if (e2) toast('Entfernen hat nicht geklappt'); else { toast(`${b.dataset.rm} hat keinen Zugang mehr`); renderAcct(); }
  };
}

/* login */
function showLogin(kind) {
  $('#login').hidden = false;
  const denied = kind === 'denied';
  $('#lMsg').textContent = denied
    ? `${me ? me.email : 'Diese Adresse'} ist noch nicht freigeschaltet. Bitte jemanden aus dem Team, dich unter „Team“ hinzuzufügen, oder melde dich mit einer anderen Adresse an.`
    : 'Melde dich mit deiner E-Mail-Adresse an. Du bekommst einen Link, mit dem du direkt eingeloggt bist.';
  $('#lForm').hidden = denied; $('#lOther').hidden = !denied; $('#lInfo').textContent = '';
  if (!denied) setStatus('signedout');
}
function hideLogin() { $('#login').hidden = true; }
$('#lForm').onsubmit = async e => {
  e.preventDefault();
  const email = $('#lMail').value.trim(); if (!email || !sb) return;
  $('#lGo').disabled = true; $('#lInfo').textContent = 'Wird gesendet …';
  const { error } = await sb.auth.signInWithOtp({ email, options: { emailRedirectTo: location.origin + location.pathname } });
  $('#lGo').disabled = false;
  $('#lInfo').textContent = error ? 'Das hat nicht geklappt: ' + error.message : `Der Link ist unterwegs an ${email}. Öffne ihn auf diesem Gerät, dann bist du eingeloggt.`;
};
$('#lOther').onclick = async () => { await sb.auth.signOut(); showLogin(); };
$('#lLocal').onclick = () => { hideLogin(); setStatus('signedout'); };

function loadScript(src) {
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('script ' + src)); document.head.append(s); });
}
function onSession(session) {
  if (session && !me) { me = session.user; startSync(); }
  else if (!session && me) {
    me = null; live = false; clearTimeout(pushT);
    if (channel) { sb.removeChannel(channel); channel = null; }
    showLogin();
  }
}
async function initCloud() {
  setStatus('connecting');
  try {
    if (!window.supabase) await loadScript(SB_LIB);
    sb = window.supabase.createClient(CLOUD.url, CLOUD.key, { auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: 'implicit' } });
    sb.auth.onAuthStateChange((_ev, session) => setTimeout(() => onSession(session), 0));
    const { data } = await sb.auth.getSession();
    if (data && data.session) onSession(data.session); else if (!me) showLogin();
  } catch (e) {
    console.warn(e); setStatus('offline');
    toast('Online-Speicherung nicht erreichbar. Du arbeitest in diesem Browser weiter.');
  }
}

if (hadView) view = { ...d0.view };
renderHeader(); setTab(store.tab);
if (!hadView) requestAnimationFrame(fit);
if (cloudOn) initCloud(); else setStatus('local');
})();
